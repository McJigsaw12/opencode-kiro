name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate manifest
        run: |
          python3 -c "import json;json.load(open('package.json'))"

      - name: Build VSIX
        run: python3 scripts/package.py

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: opencode-kiro-vsix
          path: "*.vsix"
          if-no-files-found: error
